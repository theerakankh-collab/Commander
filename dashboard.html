<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ระบบจัดการกำลังพล</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- DataTables Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrapper">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <h3>📘 Military</h3>
        </div>
        <ul>
            <li><a href="dashboard.html">🏠 Dashboard</a></li>
            <li><a href="personnel.html">👤 กำลังพล</a></li>
            <li><a href="commanders.html">⭐ ผู้บังคับบัญชา</a></li>
            <li><a href="wives.html">👩 ภริยา</a></li>
            <li><a href="reports.html">📊 รายงาน</a></li>
            <li><a href="import.html">📥 Import Excel</a></li>
            <li><a href="export.html">📄 Export Excel</a></li>
            <li><a href="settings.html">⚙️ ตั้งค่า</a></li>
            <li><a href="#" onclick="logout()">🚪 Logout</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main p-4">

        <!-- Topbar -->
        <header class="topbar d-flex justify-content-between align-items-center mb-4">
            <h2>Dashboard</h2>
            <div class="user-info d-flex align-items-center gap-3">
                <span>👤 Admin</span>
                <button class="btn btn-sm btn-outline-danger" onclick="logout()">🚪 Logout</button>
            </div>
        </header>

        <!-- Stats Cards -->
        <section class="cards mb-4">
            <div class="card green">
                <h2 id="totalPersonnel">0</h2>
                <p>กำลังพล</p>
            </div>
            <div class="card blue">
                <h2 id="totalCommander">0</h2>
                <p>ผู้บังคับบัญชา</p>
            </div>
            <div class="card yellow">
                <h2 id="totalWife">0</h2>
                <p>ภริยา</p>
            </div>
            <div class="card red">
                <h2 id="totalPhone">0</h2>
                <p>เบอร์โทร</p>
            </div>
        </section>

        <!-- Table Controls & Data Section -->
        <section class="data-table-section">
            
            <!-- Action Toolbar & Search Bar -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="d-flex gap-2">
                    <a href="add.html" class="btn btn-success">
                        ➕ เพิ่มกำลังพล
                    </a>

                    <a href="import.html" class="btn btn-primary">
                        📥 Import Excel
                    </a>

                    <button class="btn btn-warning" onclick="exportExcel()">
                        📤 Export Excel
                    </button>

                    <button class="btn btn-danger" onclick="exportPDF()">
                        🖨 Export PDF
                    </button>
                </div>

                <input
                    type="search"
                    id="search"
                    class="form-control w-25"
                    placeholder="ค้นหา...">
            </div>

            <!-- Data Table -->
            <table id="personTable" class="table table-striped table-hover w-100">
                <thead>
                    <tr>
                        <th>ยศ</th>
                        <th>ชื่อ-สกุล</th>
                        <th>ตำแหน่ง</th>
                        <th>โทรศัพท์</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="result">
                    <!-- ข้อมูลจะถูกดึงมาใส่ด้วย JS -->
                </tbody>
            </table>
        </section>

    </main>

</div>

<!-- ---------------- JAVASCRIPTS ---------------- -->
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- DataTables & Bootstrap JS -->
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Custom App Scripts -->
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>

<!-- Authentication Check -->
<script>
    checkLogin();
</script>

</body>
</html>

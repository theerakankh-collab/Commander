<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>เข้าสู่ระบบ | Military Directory</title>

    <meta name="description" content="Military Directory System">

    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body class="login-page" data-page="login">

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">

<div class="card shadow-lg border-0 rounded-4">

<div class="card-body p-4">

<!-- ===================================== -->
<!-- Logo -->
<!-- ===================================== -->

<div class="text-center mb-3">

<img

src="images/logo.png"

alt="Military Directory"

width="90"

height="90"

class="img-fluid">

</div>

<h3 class="text-center fw-bold text-success mb-1">

Military Directory

</h3>

<p class="text-center text-muted mb-4">

ระบบฐานข้อมูลกำลังพล

</p>

<!-- ===================================== -->
<!-- Login Form -->
<!-- ===================================== -->

<form

id="loginForm"

autocomplete="on"

novalidate>

<div class="mb-3">

<label

for="email"

class="form-label">

<i class="bi bi-envelope-fill"></i>

อีเมล

</label>

<input

id="email"

name="email"

type="email"

class="form-control"

placeholder="name@example.com"

autocomplete="username"

autofocus

required>

</div>

<div class="mb-3">

<label

for="password"

class="form-label">

<i class="bi bi-lock-fill"></i>

รหัสผ่าน

</label>

<div class="input-group">

<input

id="password"

name="password"

type="password"

class="form-control"

placeholder="••••••••"

autocomplete="current-password"

required>

<button

id="togglePassword"

type="button"

class="btn btn-outline-secondary"

aria-label="แสดงหรือซ่อนรหัสผ่าน">

<i class="bi bi-eye"></i>

</button>

</div>

</div>

<div class="d-flex justify-content-between align-items-center mb-4">

<div class="form-check">

<input

id="remember"

name="remember"

class="form-check-input"

type="checkbox">

<label

class="form-check-label"

for="remember">

จดจำการเข้าสู่ระบบ

</label>

</div>

<a

href="forgot-password.html"

class="small text-decoration-none">

ลืมรหัสผ่าน?

</a>

</div>

<button

id="loginBtn"

type="submit"

class="btn btn-success w-100 py-2"

aria-label="เข้าสู่ระบบ">

<span id="btnText">

เข้าสู่ระบบ

</span>

<span

id="btnLoading"

class="spinner-border spinner-border-sm d-none"

role="status"

aria-hidden="true">

</span>

</button>

</form>

<!-- ===================================== -->
<!-- Message -->
<!-- ===================================== -->

<div

id="msg"

class="alert alert-danger d-none mt-3"

role="alert">

</div>

<hr>

<!-- ===================================== -->
<!-- Footer -->
<!-- ===================================== -->

<div class="text-center">

<small class="text-muted">

Military Directory System

<br>

Version 2.0

</small>

<br>

<small class="text-muted">

© 2026 Military Directory

</small>

</div>

</div>

</div>

</div>

</div>

</div>

<!-- ===================================== -->
<!-- JavaScript -->
<!-- ===================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/auth.js"></script>

<script src="js/login.js"></script>

</body>

</html>

<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>เข้าสู่ระบบ - Military Directory</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light d-flex align-items-center min-vh-100">

    <div class="container" style="max-width: 400px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                
                <h3 class="text-center fw-bold mb-4 text-success">เข้าสู่ระบบ</h3>

                <!-- ห่อด้วย Form เพื่อรองรับการกด Enter -->
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">อีเมล</label>
                        <input id="email" type="email" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">รหัสผ่าน</label>
                        <input id="password" type="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button id="loginBtn" type="submit" class="btn btn-success w-100 py-2 mt-2">
                        เข้าสู่ระบบ
                    </button>
                </form>

                <!-- จุดแสดงข้อความแจ้งเตือน / Error -->
                <div id="msg" class="text-danger text-center mt-3 small"></div>

            </div>
        </div>
    </div>

    <!-- JavaScript Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>ข้อมูลกำลังพล</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="css/style.css"
rel="stylesheet">

</head>

<body data-auth="required">

<div class="container py-4">

<div class="row">

<div class="col-lg-4">

<div class="card shadow">

<div class="card-body text-center">

<img

id="photo"

src="images/no-photo.png"

class="img-thumbnail rounded"

style="width:220px;height:270px;object-fit:cover;">


<h3

class="mt-3"

id="fullname">

-

</h3>

<p

class="text-muted"

id="position">

-

</p>

<span

class="badge bg-primary"

id="role">

user

</span>

</div>

</div>

</div>

<div class="col-lg-8">

<div class="card shadow">

<div class="card-header">

<h4>

ข้อมูลกำลังพล

</h4>

</div>

<div class="card-body">

<table

class="table table-bordered">

<tr>

<th width="180">

ยศ

</th>

<td id="rank"></td>

</tr>

<tr>

<th>

ชื่อ

</th>

<td id="firstname"></td>

</tr>

<tr>

<th>

นามสกุล

</th>

<td id="lastname"></td>

</tr>

<tr>

<th>

ชื่อเล่น

</th>

<td id="nickname"></td>

</tr>

<tr>

<th>

ตำแหน่ง

</th>

<td id="position_text"></td>

</tr>

<tr>

<th>

ชั้น

</th>

<td id="class_name"></td>

</tr>

<tr>

<th>

เบอร์โทร

</th>

<td id="phone"></td>

</tr>

<tr>

<th>

หมายเหตุ

</th>

<td id="remark"></td>

</tr>

</table>

</div>

</div>

<div class="card shadow mt-3">

<div class="card-header">

<h4>

ข้อมูลภริยา

</h4>

</div>

<div class="card-body">

<table

class="table table-bordered">

<tr>

<th width="180">

ชื่อภริยา

</th>

<td id="wife_name">

-

</td>

</tr>

<tr>

<th>

เบอร์โทร

</th>

<td id="wife_phone">

-

</td>

</tr>

</table>

</div>

</div>

<div class="mt-4">

<a

id="btnEdit"

class="btn btn-warning"

href="#">

แก้ไข

</a>

<button

class="btn btn-primary"

onclick="refresh()">

รีเฟรช

</button>

<button

class="btn btn-secondary"

onclick="backDashboard()">

กลับ Dashboard

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="js/config.js"></script>

<script src="js/auth.js"></script>

<script src="js/profile.js"></script>

</body>

</html>

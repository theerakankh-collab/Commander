<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>เพิ่มกำลังพล</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>

</head>

<body>

<div class="container mt-4">

<h3>เพิ่มข้อมูลกำลังพล</h3>

<form id="frm">

<div class="row">

<div class="col-md-2">
<label>ยศ</label>
<input id="rank" class="form-control">
</div>

<div class="col-md-5">
<label>ชื่อ</label>
<input id="firstname" class="form-control">
</div>

<div class="col-md-5">
<label>นามสกุล</label>
<input id="lastname" class="form-control">
</div>

<div class="col-md-6 mt-3">
<label>ตำแหน่ง</label>
<input id="position" class="form-control">
</div>

<div class="col-md-3 mt-3">
<label>ชื่อเล่น</label>
<input id="nickname" class="form-control">
</div>

<div class="col-md-3 mt-3">
<label>ตท.</label>
<input id="class" class="form-control">
</div>

<div class="col-md-4 mt-3">
<label>โทรศัพท์</label>
<input id="phone" class="form-control">
</div>

<div class="col-md-8 mt-3">
<label>หมายเหตุ</label>
<input id="remark" class="form-control">
</div>

</div>

<button
type="button"
class="btn btn-success mt-4"
onclick="save()">

บันทึก

</button>

<a
href="dashboard.html"
class="btn btn-secondary mt-4">

ยกเลิก

</a>

</form>

</div>

<script src="js/add.js"></script>

</body>
</html>

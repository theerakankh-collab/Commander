<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Military Directory - Dashboard</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-dark bg-success">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1">
                ทำเนียบกำลังพล
            </span>
            <!-- ปุ่ม Logout เพิ่มใน Navbar เพื่อความสวยงาม -->
            <button class="btn btn-outline-light btn-sm" onclick="logout()">
                ออกจากระบบ
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">

        <!-- Stat Cards -->
        <div class="row g-3">
            <div class="col-md-4">
                <div class="card text-center border-success shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title text-success fw-bold" id="totalPersonnel">0</h3>
                        <p class="card-text text-muted mb-0">กำลังพล</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-center border-primary shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title text-primary fw-bold" id="totalCommander">0</h3>
                        <p class="card-text text-muted mb-0">ผู้บังคับบัญชา</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-center border-warning shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title text-warning fw-bold" id="totalWife">0</h3>
                        <p class="card-text text-muted mb-0">ภริยา</p>
                    </div>
                </div>
            </div>
        </div>

        <hr class="my-4">

        <!-- Navigation Buttons -->
        <div class="d-flex gap-2 wrap">
            <a href="personnel.html" class="btn btn-success">
                รายชื่อกำลังพล
            </a>
            <a href="commanders.html" class="btn btn-primary">
                ผู้บังคับบัญชา
            </a>
            <a href="wives.html" class="btn btn-warning text-dark">
                ภริยา
            </a>
        </div>

    </div>

    <!-- JavaScript Dependencies -->
    <!-- 1. Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Configuration & Authentication -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

    <!-- 3. Page Logic -->
    <script src="js/dashboard.js"></script>

    <!-- 4. Execute Protection Check -->
    <script>
        // ตรวจสอบสิทธิ์การเข้าใช้งานหน้านี้
        if (typeof checkLogin === 'function') {
            checkLogin();
        }
    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
